<tr class="hover:bg-slate-50 transition-colors">
    <td class="px-6 py-3 font-mono text-xs text-slate-500 whitespace-nowrap">{{.ID}}</td>
    <td class="px-6 py-3 text-slate-800 whitespace-nowrap">{{.Name}}</td>
    <td class="px-6 py-3 text-slate-500 whitespace-nowrap">{{.Date}}</td>
    <td class="px-6 py-3 whitespace-nowrap">
        <span class="status-indicator status-{{.Status}}">{{.Status}}</span>
    </td>
    <td class="px-6 py-3 text-slate-500 whitespace-nowrap">
        {{ if eq .Status "working" }}
            {{ if gt .Data.PlacesFound 0 }}
                {{.Data.PlacesCompleted}} / {{.Data.PlacesFound}}
            {{ else }}
                searching&hellip;
            {{ end }}
        {{ end }}
    </td>
    <td class="px-6 py-3 whitespace-nowrap">
        <span class="text-xs text-slate-300">&mdash;</span>
    </td>
    <td class="px-6 py-3 whitespace-nowrap">
        <div class="flex items-center gap-2">
            {{ if eq .Status "ok" }}
                <a href="/download?id={{.ID}}" download
                   class="inline-flex items-center rounded-md bg-green-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-green-700 transition-colors">Download</a>
            {{ end }}
            <button hx-delete="/delete?id={{.ID}}"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this job?"
                    class="inline-flex items-center rounded-md bg-red-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-red-700 transition-colors">Delete</button>
        </div>
    </td>
</tr>
